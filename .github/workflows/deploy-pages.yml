name: Deploy Trioak Furniture Website to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment-status.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static website
        env:
          NEXT_PUBLIC_SITE_URL: https://satitech-official.github.io/trioak-furniture-website
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trioak-build-log
          path: build.log

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record-status:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Record deployment result
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.build.result }}' === 'success' && '${{ needs.deploy.result }}' === 'success' ? 'success' : 'failure';
            const content = JSON.stringify({
              status,
              build: '${{ needs.build.result }}',
              deploy: '${{ needs.deploy.result }}',
              pageUrl: 'https://satitech-official.github.io/trioak-furniture-website/',
              commit: context.sha,
              runId: context.runId,
              verifiedAt: new Date().toISOString()
            }, null, 2) + '\n';
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'deployment-status.json',
                ref: 'main'
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'deployment-status.json',
              message: `Record GitHub Pages deployment ${status}`,
              content: Buffer.from(content).toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {})
            });
